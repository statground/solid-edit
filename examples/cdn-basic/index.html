<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SolidEdit — Full and Mini</title>
<style>
body{margin:0;background:#f4f6f8;color:#182234;font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:40px auto;padding:0 20px}h1{font-size:32px;margin-bottom:8px}p{margin:8px 0 24px;color:#526174}.modes{display:flex;gap:8px;margin:24px 0 12px}button{font:inherit;padding:8px 16px;border:1px solid #ced6df;border-radius:6px;background:white;color:inherit;cursor:pointer}button[aria-pressed=true]{color:#1859bd;background:#eaf1ff;border-color:#92b5ee}button:focus-visible{outline:2px solid #2563eb;outline-offset:3px}#mount{background:white}textarea{box-sizing:border-box;width:100%;min-height:240px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border:1px solid #dce2e8;border-radius:8px}details{margin-top:24px}summary{cursor:pointer}
</style>
<script>window.CONTENT_EDITOR_AUTOSTART=false;window.CONTENT_EDITOR_AUTOINIT=false;</script>
<script src="../../versions/0.0.4/editor.js"></script>
</head>
<body><main>
<h1>A comfortable space to write</h1>
<p>Full gives documents room to grow. Mini keeps comments and short notes compact. Both include the same editing tools.</p>
<div class="modes" role="group" aria-label="Editor size"><button type="button" data-mode="full" aria-pressed="true">Full · Documents</button><button type="button" data-mode="mini" aria-pressed="false">Mini · Notes</button></div>
<div id="mount"><textarea id="content"><h2>A small garden, a fresh start</h2><p>Our community garden is ready for the next season. <strong>Bring your ideas</strong>, choose a task, and help something grow.</p><blockquote>Good things grow when we make room for them.</blockquote><h3>Plan for Saturday</h3><table><thead><tr><th>Time</th><th>Activity</th></tr></thead><tbody><tr><td>09:00</td><td>Prepare the soil</td></tr><tr><td>10:00</td><td>Plant herbs and seedlings</td></tr></tbody></table><ul><li>Bring gloves and a water bottle.</li><li>Label each plant before watering.</li></ul><p>Learn more about the editor in the <a href="https://github.com/statground/solid-edit">SolidEdit repository</a>.</p></textarea></div>
<p id="status" role="status" aria-live="polite"></p>
<details><summary>See the document HTML</summary><button id="refresh" type="button">Refresh HTML</button><pre id="output"></pre></details>
</main><script>
let editor;
function mount(mode){
  const source=document.getElementById('content');
  if(editor){source.value=editor.getHTML();window.destroyLocalRichEditor(editor);}
  editor=window.mountContentEditor(source,{lang:'en',toolbarSize:mode,html:source.value,restoreDraft:false,storageKey:'solid-edit-example-0.0.4'});
  document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));
  document.getElementById('status').textContent=mode==='mini'?'Mini · Same document, compact writing area.':'Full · Your document grows as you write.';
  window.demoEditor=editor;
}
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>mount(button.dataset.mode)));
document.getElementById('refresh').addEventListener('click',()=>document.getElementById('output').textContent=editor.getHTML());
mount('full');
</script></body></html>
